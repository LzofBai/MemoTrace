<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoTrace - 微信聊天记录查看器</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 登录/解析数据界面 -->
    <div id="login-modal" class="login-modal" style="display: flex;">
        <div class="login-modal-content">
            <div class="login-header">
                <h2><i class="fas fa-file-import"></i> 解析数据</h2>
                <p>以下内容为自动获取，如获取失败请手动填写</p>
            </div>
            
            <div class="login-form">
                <!-- 版本选择 -->
                <div class="form-row">
                    <label>版本</label>
                    <div class="form-input-group">
                        <select id="wx-version" class="form-select">
                            <option value="3">微信 3.x</option>
                            <option value="4">微信 4.x</option>
                        </select>
                        <button id="btn-get-info" class="btn btn-primary btn-small" onclick="fetchWechatInfo()">
                            <i class="fas fa-fingerprint"></i> 获取信息
                        </button>
                    </div>
                </div>
                
                <!-- 手机号 -->
                <div class="form-row">
                    <label>手机号</label>
                    <input type="text" id="wx-mobile" class="form-input" placeholder="自动获取或手动填写">
                </div>
                
                <!-- 昵称 -->
                <div class="form-row">
                    <label>昵称</label>
                    <input type="text" id="wx-name" class="form-input" placeholder="自动获取或手动填写">
                </div>
                
                <!-- wxid -->
                <div class="form-row">
                    <label>wxid</label>
                    <input type="text" id="wx-wxid" class="form-input" placeholder="自动获取或手动填写">
                </div>
                
                <!-- Key（新增） -->
                <div class="form-row">
                    <label>Key</label>
                    <div class="form-input-group">
                        <input type="text" id="wx-key" class="form-input key-input" placeholder="自动获取或手动填写" readonly>
                        <button class="btn btn-secondary btn-small" onclick="toggleKeyVisibility()">
                            <i class="fas fa-eye" id="key-toggle-icon"></i>
                        </button>
                    </div>
                </div>
                
                <!-- 微信路径 -->
                <div class="form-row">
                    <label>微信路径</label>
                    <div class="form-input-group">
                        <input type="text" id="wx-path" class="form-input" placeholder="选择微信数据文件夹" readonly>
                        <button class="btn btn-secondary btn-small" onclick="selectWechatPath()">
                            <i class="fas fa-folder-open"></i> 设置微信路径
                        </button>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="form-actions">
                    <button id="btn-parse" class="btn btn-primary" onclick="parseData()" disabled>
                        <i class="fas fa-play"></i> 解析数据
                    </button>
                    <button id="btn-incremental" class="btn btn-secondary" onclick="parseIncremental()" disabled>
                        <i class="fas fa-sync"></i> 增量解析
                    </button>
                </div>
                
                <!-- 状态显示 -->
                <div class="form-status">
                    <span id="parse-status" class="status-text">未就绪</span>
                    <span id="parse-progress" class="progress-text">0%</span>
                </div>
                
                <!-- 进度条 -->
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <!-- 用户信息 -->
            <div class="user-profile">
                <img src="https://via.placeholder.com/40" alt="头像" class="avatar" id="user-avatar">
                <span class="username">MemoTrace</span>
            </div>
            
            <!-- 搜索框 -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="搜索" id="search-input">
            </div>
            
            <!-- 标签页切换 -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="chat">
                    <i class="fas fa-comment"></i>
                    <span>聊天</span>
                </button>
                <button class="tab-btn" data-tab="contacts">
                    <i class="fas fa-address-book"></i>
                    <span>好友</span>
                </button>
            </div>
            
            <!-- 聊天列表 -->
            <div class="tab-content active" id="chat-tab">
                <div class="chat-list" id="chat-list">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <!-- 联系人列表 -->
            <div class="tab-content" id="contacts-tab">
                <div class="contact-list" id="contact-list">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
        
        <!-- 右侧聊天区域 -->
        <div class="chat-area" id="chat-area">
            <!-- 未选择聊天时的提示 -->
            <div class="empty-state" id="empty-state">
                <i class="fas fa-comments"></i>
                <p>选择一个聊天开始查看</p>
            </div>
            
            <!-- 聊天头部 -->
            <div class="chat-header" id="chat-header" style="display: none;">
                <div class="chat-title">
                    <span id="chat-name">聊天对象</span>
                    <span class="chat-type" id="chat-type"></span>
                </div>
                <div class="chat-actions">
                    <button class="action-btn" id="export-btn" title="导出聊天记录">
                        <i class="fas fa-file-export"></i>
                    </button>
                    <button class="action-btn" id="view-members-btn" style="display: none;" title="查看群成员">
                        <i class="fas fa-users"></i>
                    </button>
                    <button class="action-btn" title="更多">
                        <i class="fas fa-ellipsis-h"></i>
                    </button>
                </div>
            </div>
            
            <!-- 消息列表 -->
            <div class="message-list" id="message-list" style="display: none;">
                <!-- 动态生成 -->
            </div>
            
            <!-- 加载更多按钮 -->
            <div class="load-more" id="load-more" style="display: none;">
                <button onclick="loadMoreMessages()">加载更多</button>
            </div>
            
            <!-- 发送框（仅展示） -->
            <div class="input-area" id="input-area" style="display: none;">
                <div class="input-toolbar">
                    <button class="toolbar-btn"><i class="far fa-smile"></i></button>
                    <button class="toolbar-btn"><i class="far fa-folder"></i></button>
                    <button class="toolbar-btn"><i class="fas fa-cut"></i></button>
                    <button class="toolbar-btn"><i class="fas fa-phone-alt"></i></button>
                </div>
                <textarea placeholder="此页面仅供查看历史记录，不支持发送消息" disabled></textarea>
                <div class="input-footer">
                    <span class="hint">Enter 发送 / Shift+Enter 换行</span>
                    <button class="send-btn" disabled>发送</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 群成员侧边栏（点击群聊时显示） -->
    <div class="member-sidebar" id="member-sidebar" style="display: none;">
        <div class="member-header">
            <h3>群成员</h3>
            <button class="close-btn" onclick="closeMemberSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="member-list" id="member-list">
            <!-- 动态生成 -->
        </div>
    </div>
    
    <!-- 导出聊天记录模态框 -->
    <div class="export-modal" id="export-modal" style="display: none;">
        <div class="export-modal-content">
            <div class="export-modal-header">
                <h3><i class="fas fa-file-export"></i> 导出聊天记录</h3>
                <button class="close-btn" onclick="closeExportModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="export-modal-body">
                <!-- 导出格式选择 -->
                <div class="export-section">
                    <label class="export-label"><i class="fas fa-file-export"></i> 导出格式</label>
                    <select class="export-select" id="export-format-select">
                        <option value="">加载中...</option>
                    </select>
                </div>
                
                <!-- 时间范围选择 -->
                <div class="export-section">
                    <label class="export-label"><i class="far fa-calendar-alt"></i> 时间范围</label>
                    <select class="export-select" id="export-date-range-select">
                        <option value="">加载中...</option>
                    </select>
                    
                    <!-- 自定义时间选择器 -->
                    <div class="custom-date-picker" id="custom-date-picker" style="display: none; margin-top: 12px;">
                        <div class="date-input-group">
                            <label>开始日期</label>
                            <input type="date" id="start-date">
                        </div>
                        <div class="date-input-group">
                            <label>结束日期</label>
                            <input type="date" id="end-date">
                        </div>
                    </div>
                </div>
                
                <!-- 群成员选择（仅群聊显示） -->
                <div class="export-section" id="member-select-section" style="display: none;">
                    <label class="export-label"><i class="fas fa-user-check"></i> 指定成员</label>
                    <div class="member-search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="member-search-input" placeholder="搜索成员...">
                    </div>
                    <select class="export-select" id="export-member-select" size="5">
                        <option value="">加载中...</option>
                    </select>
                </div>
                
                <!-- 消息类型选择 -->
                <div class="export-section">
                    <label class="export-label"><i class="fas fa-filter"></i> 消息类型</label>
                    <div class="msg-type-actions">
                        <label class="checkbox-label">
                            <input type="checkbox" id="select-all-msg-types" checked onchange="toggleAllMsgTypes(this.checked)">
                            <span>全选</span>
                        </label>
                    </div>
                    <div class="msg-type-checkbox-list" id="msg-type-checkbox-list">
                        <!-- 动态生成消息类型复选框 -->
                        <div class="loading-text">加载中...</div>
                    </div>
                </div>
            </div>
            
            <div class="export-modal-footer">
                <span class="export-hint" id="export-hint">正在加载配置...</span>
                <div class="export-buttons">
                    <button class="btn btn-secondary" onclick="closeExportModal()">取消</button>
                    <button class="btn btn-primary" id="confirm-export-btn" onclick="confirmExport()">
                        <i class="fas fa-download"></i> 导出
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
    <script src="/static/export.js"></script>
</body>
</html>
