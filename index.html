<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信数据管理工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>微信数据管理工具</h1>
            <p class="subtitle">解密、查看联系人、导出聊天记录</p>
        </header>

        <main>
            <!-- Step 1: 解密数据 -->
            <section class="step-section" id="step1">
                <div class="step-header">
                    <div class="step-number">1</div>
                    <h2>解密微信数据</h2>
                    <span class="step-status" id="step1-status">待处理</span>
                </div>
                <div class="step-content">
                    <div class="form-group">
                        <label for="wechat-version">微信版本:</label>
                        <select id="wechat-version" class="form-control">
                            <option value="3">微信3.x版本</option>
                            <option value="4" selected>微信4.0版本</option>
                        </select>
                    </div>
                    <button id="decrypt-btn" class="btn btn-primary">
                        <span class="btn-icon">🔓</span>
                        开始解密
                    </button>
                    <div class="progress-container" id="decrypt-progress" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="decrypt-progress-fill"></div>
                        </div>
                        <span class="progress-text" id="decrypt-progress-text">0%</span>
                    </div>
                    <div class="result-container" id="decrypt-result"></div>
                </div>
            </section>

            <!-- Step 2: 查看联系人 -->
            <section class="step-section" id="step2">
                <div class="step-header">
                    <div class="step-number">2</div>
                    <h2>查看联系人</h2>
                    <span class="step-status" id="step2-status">待处理</span>
                </div>
                <div class="step-content">
                    <div class="form-group">
                        <label for="db-path">数据库路径:</label>
                        <input type="text" id="db-path" class="form-control" placeholder="例如: ./wxid_xxx/db_storage">
                        <button id="browse-db" class="btn btn-secondary">浏览...</button>
                    </div>
                    <button id="view-contacts-btn" class="btn btn-primary" disabled>
                        <span class="btn-icon">👥</span>
                        查看联系人
                    </button>
                    <div class="contacts-container" id="contacts-container" style="display: none;">
                        <div class="contacts-header">
                            <h3>联系人列表</h3>
                            <div class="search-box">
                                <input type="text" id="contact-search" placeholder="搜索联系人...">
                                <span class="search-icon">🔍</span>
                            </div>
                        </div>
                        <div class="contacts-list" id="contacts-list"></div>
                    </div>
                </div>
            </section>

            <!-- Step 3: 导出数据 -->
            <section class="step-section" id="step3">
                <div class="step-header">
                    <div class="step-number">3</div>
                    <h2>导出聊天记录</h2>
                    <span class="step-status" id="step3-status">待处理</span>
                </div>
                <div class="step-content">
                    <div class="export-form">
                        <div class="form-group">
                            <label for="export-wxid">联系人WXID:</label>
                            <input type="text" id="export-wxid" class="form-control" placeholder="例如: wxid_00112233">
                            <button id="select-contact" class="btn btn-secondary">从列表选择</button>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="export-format">导出格式:</label>
                                <select id="export-format" class="form-control">
                                    <option value="html">HTML</option>
                                    <option value="txt">纯文本</option>
                                    <option value="ai_txt">AI优化文本</option>
                                    <option value="markdown">Markdown</option>
                                    <option value="xlsx">Excel</option>
                                    <option value="docx">Word文档</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="output-dir">输出目录:</label>
                                <input type="text" id="output-dir" class="form-control" value="./data/">
                                <button id="browse-output" class="btn btn-secondary">浏览...</button>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="start-date">开始日期:</label>
                                <input type="datetime-local" id="start-date" class="form-control" value="2020-01-01T00:00">
                            </div>
                            <div class="form-group">
                                <label for="end-date">结束日期:</label>
                                <input type="datetime-local" id="end-date" class="form-control" value="2035-03-12T00:00">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>消息类型:</label>
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="message-types" value="text" checked>
                                    文本消息
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="message-types" value="image" checked>
                                    图片消息
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="message-types" value="link" checked>
                                    链接消息
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="message-types" value="merged" checked>
                                    合并消息
                                </label>
                            </div>
                        </div>
                        <div class="export-actions">
                            <button id="export-btn" class="btn btn-primary">
                                <span class="btn-icon">📤</span>
                                导出聊天记录
                            </button>
                            <button id="batch-export-btn" class="btn btn-secondary">
                                <span class="btn-icon">📦</span>
                                批量导出
                            </button>
                        </div>
                    </div>
                    <div class="progress-container" id="export-progress" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="export-progress-fill"></div>
                        </div>
                        <span class="progress-text" id="export-progress-text">0%</span>
                    </div>
                    <div class="result-container" id="export-result"></div>
                </div>
            </section>
        </main>

        <!-- Contact Selection Modal -->
        <div id="contact-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>选择联系人</h3>
                    <span class="close" id="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="search-box">
                        <input type="text" id="modal-contact-search" placeholder="搜索联系人...">
                        <span class="search-icon">🔍</span>
                    </div>
                    <div class="contacts-list" id="modal-contacts-list"></div>
                </div>
                <div class="modal-footer">
                    <button id="confirm-contact" class="btn btn-primary">确定</button>
                    <button id="cancel-contact" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 微信数据管理工具 | 基于 wxManager</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
